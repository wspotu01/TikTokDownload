name: Public UI dependency compatibility fix
on:
  push:
    branches: ['build/public-ui-dependencies-20261013']
    paths: ['.github/workflows/public-ui-dependency-fix.yml']
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: public-ui-dependencies
          run-id: 38381354142
          github-token: ${{ github.token }}
      - name: Resolve a shared official motion version with npm
        shell: bash
        run: |
          sha256sum -c SHA256SUMS.txt
          tar -xzf public-ui-dependencies.tar.gz
          cd public-ui-dependencies
          cp package-lock.json before-lock.json
          npm pkg set 'overrides.@fluentui/react-motion=9.16.4'
          npm install --no-audit --no-fund --ignore-scripts --package-lock=true
          npm ls --all > dependency-tree.txt
          npm ls --depth=0 > dependency-versions.txt
          node <<'JS'
          const fs=require('fs');
          const old=JSON.parse(fs.readFileSync('before-lock.json')).packages;
          const next=JSON.parse(fs.readFileSync('package-lock.json')).packages;
          const changed=Object.keys(next).filter(k=>k&&JSON.stringify(old[k])!==JSON.stringify(next[k]));
          const removed=Object.keys(old).filter(k=>k&&!next[k]);
          const manifest={changed,removed};
          fs.writeFileSync('delta.json',JSON.stringify(manifest,null,2));
          fs.writeFileSync('delta-paths.txt',changed.filter(k=>!changed.some(p=>p!==k&&k.startsWith(p+'/'))).join('\n')+'\n');
          console.log(JSON.stringify(manifest,null,2));
          JS
          tar -czf ../public-ui-dependency-fix.tar.gz package.json package-lock.json dependency-versions.txt dependency-tree.txt delta.json -T delta-paths.txt
          cd ..
          sha256sum public-ui-dependency-fix.tar.gz > FIX-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: public-ui-dependency-fix
          path: |
            public-ui-dependency-fix.tar.gz
            FIX-SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

name: Public UI dependency bundle
on:
  push:
    branches: ['build/public-ui-dependencies-20261013']
    paths: ['.github/workflows/public-ui-dependencies.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only public packages in an empty directory
        shell: bash
        run: |
          mkdir -p public-ui-dependencies
          cd public-ui-dependencies
          cat > package.json <<'JSON'
          {
            "name": "public-react-ui-dependency-bundle",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "@radix-ui/themes": "3.2.1",
              "@primer/react": "37.0.0",
              "styled-components": "5.3.11",
              "@carbon/react": "1.70.0",
              "@carbon/styles": "1.70.0",
              "@fluentui/react-components": "9.54.0",
              "tdesign-react": "1.12.0"
            },
            "devDependencies": {
              "@types/react": "^18.3.0",
              "@types/react-dom": "^18.3.0",
              "@types/node": "^22.0.0",
              "@types/styled-components": "^5.1.34",
              "typescript": "^5.7.2",
              "vite": "^6.0.0",
              "@playwright/test": "^1.56.0"
            }
          }
          JSON
          npm view @primer/react@37.0.0 version peerDependencies
          npm install --no-audit --no-fund --ignore-scripts --package-lock=true
          npm ls --depth=0 > dependency-versions.txt
          cd ..
          tar -czf public-ui-dependencies.tar.gz public-ui-dependencies
          sha256sum public-ui-dependencies.tar.gz > SHA256SUMS.txt
      - name: Retain public dependency archive for offline local compilation
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-dependencies
          path: |
            public-ui-dependencies.tar.gz
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
